version: '3'
services:
  react-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - nginx

  express-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      replicas: 3  # Exercise 5: runs 3 instances of the backend service for availability
    ports:
      - "3001"
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - express-api
